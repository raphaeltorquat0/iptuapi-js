name: SDK Validation

on:
  workflow_call:
    secrets:
      IPTU_TEST_API_KEY:
        required: true
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC

env:
  API_BASE_URL: https://api.iptuapi.com.br

jobs:
  clean-environment-test:
    name: Clean Environment Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Create clean test directory
        run: mkdir -p /tmp/sdk-clean-test && cd /tmp/sdk-clean-test

      - name: Install SDK from npm registry
        working-directory: /tmp/sdk-clean-test
        run: |
          npm init -y
          npm install iptuapi

      - name: Test CJS import
        working-directory: /tmp/sdk-clean-test
        run: |
          node -e "
            const { IPTUClient } = require('iptuapi');
            if (!IPTUClient) {
              console.error('IPTUClient not found in CJS export');
              process.exit(1);
            }
            console.log('CJS import successful');
          "

      - name: Test ESM import
        working-directory: /tmp/sdk-clean-test
        run: |
          cat > test-esm.mjs << 'EOF'
          import { IPTUClient } from 'iptuapi';
          if (!IPTUClient) {
            console.error('IPTUClient not found in ESM export');
            process.exit(1);
          }
          console.log('ESM import successful');
          EOF
          node test-esm.mjs

  smoke-test-real-api:
    name: Smoke Test Real API
    runs-on: ubuntu-latest
    needs: clean-environment-test
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create test directory
        run: mkdir -p /tmp/sdk-smoke-test

      - name: Install SDK from npm registry
        working-directory: /tmp/sdk-smoke-test
        run: |
          npm init -y
          npm install iptuapi

      - name: Test API key with curl (debug)
        env:
          IPTU_TEST_API_KEY: ${{ secrets.IPTU_TEST_API_KEY }}
        run: |
          echo "API key length: ${#IPTU_TEST_API_KEY}"
          echo "API key prefix: ${IPTU_TEST_API_KEY:0:10}..."
          curl -s -X GET "https://iptuapi.com.br/api/v1/iptu-tools/cidades" \
            -H "X-API-Key: $IPTU_TEST_API_KEY" | head -c 200

      - name: Test iptuToolsCidades endpoint
        working-directory: /tmp/sdk-smoke-test
        env:
          IPTU_TEST_API_KEY: ${{ secrets.IPTU_TEST_API_KEY }}
        run: |
          node -e "
            const { IPTUClient } = require('iptuapi');

            async function testEndpoint() {
              const apiKey = process.env.IPTU_TEST_API_KEY;
              if (!apiKey) {
                throw new Error('IPTU_TEST_API_KEY not set');
              }

              const client = new IPTUClient({ apiKey });

              console.log('Testing iptuToolsCidades...');
              const result = await client.iptuToolsCidades();

              // Validate response structure
              if (!result.cidades || !Array.isArray(result.cidades)) {
                throw new Error('Expected cidades to be an array');
              }

              if (result.total < 9) {
                throw new Error('Expected at least 9 cidades, got ' + result.total);
              }

              console.log('iptuToolsCidades test passed!');
              console.log('Total cidades:', result.total);
            }

            testEndpoint().catch(err => {
              console.error('Test failed:', err.message);
              process.exit(1);
            });
          "

      - name: Test authenticated endpoint (consultaEndereco)
        working-directory: /tmp/sdk-smoke-test
        env:
          IPTU_TEST_API_KEY: ${{ secrets.IPTU_TEST_API_KEY }}
        run: |
          node -e "
            const { IPTUClient } = require('iptuapi');

            async function testAuthenticatedEndpoint() {
              const apiKey = process.env.IPTU_TEST_API_KEY;
              if (!apiKey) {
                throw new Error('IPTU_TEST_API_KEY not set');
              }

              const client = new IPTUClient({ apiKey });

              console.log('Testing consultaEndereco (authenticated endpoint)...');
              const result = await client.consultaEndereco({
                logradouro: 'Avenida Paulista',
                numero: '1000',
                cidade: 'sp'
              });

              // Validate response structure
              if (!result.sql || typeof result.sql !== 'string' || result.sql.length === 0) {
                throw new Error('Expected sql to be a non-empty string');
              }

              console.log('Authenticated endpoint test passed!');
              console.log('SQL field present:', result.sql.substring(0, 50) + '...');
            }

            testAuthenticatedEndpoint().catch(err => {
              console.error('Test failed:', err.message);
              process.exit(1);
            });
          "

      - name: Validation complete
        run: |
          echo "All SDK validation tests passed!"
          echo "- Clean environment install: OK"
          echo "- CJS import: OK"
          echo "- ESM import: OK"
          echo "- Public API (iptuToolsCidades): OK"
          echo "- Authenticated API (consultaEndereco): OK"

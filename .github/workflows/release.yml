name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            package.json
            package-lock.json
            README.md
            LICENSE
            CHANGELOG.md

  validate-real-api:
    name: Validate Real API
    uses: ./.github/workflows/sdk-validation.yml
    secrets:
      IPTU_TEST_API_KEY: ${{ secrets.IPTU_TEST_API_KEY }}

  test-package:
    name: Test Package
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: package/

      - name: Test import (CJS)
        run: |
          cd package
          npm pack
          cd ..
          mkdir test-cjs && cd test-cjs
          npm init -y
          npm install ../package/*.tgz
          node -e "const { IPTUClient } = require('iptuapi'); console.log('CJS import successful');"

      - name: Test import (ESM)
        run: |
          cd package
          cd ..
          mkdir test-esm && cd test-esm
          echo '{"type": "module"}' > package.json
          npm install ../package/*.tgz
          node -e "import { IPTUClient } from 'iptuapi'; console.log('ESM import successful');"

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build, test-package, validate-real-api]
    if: "!contains(github.ref, '-alpha') && !contains(github.ref, '-beta') && !contains(github.ref, '-rc')"
    environment:
      name: npm
      url: https://www.npmjs.com/package/iptuapi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-prerelease:
    name: Publish Prerelease to npm
    runs-on: ubuntu-latest
    needs: [build, test-package, validate-real-api]
    if: contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc')
    environment:
      name: npm-prerelease
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Determine npm tag
        id: npm_tag
        run: |
          if [[ "${{ github.ref }}" == *"-alpha"* ]]; then
            echo "TAG=alpha" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == *"-beta"* ]]; then
            echo "TAG=beta" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == *"-rc"* ]]; then
            echo "TAG=rc" >> $GITHUB_OUTPUT
          else
            echo "TAG=next" >> $GITHUB_OUTPUT
          fi

      - name: Publish prerelease to npm
        run: npm publish --provenance --access public --tag ${{ steps.npm_tag.outputs.TAG }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm]
    if: "!contains(github.ref, '-alpha') && !contains(github.ref, '-beta') && !contains(github.ref, '-rc')"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Create tarball
        run: npm pack

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          VERSION_NUM="${VERSION#v}"

          CHANGELOG=$(awk "/^## \[${VERSION_NUM}\]|^## ${VERSION_NUM}/,/^## \[?[0-9]+\.[0-9]+\.[0-9]+\]?/" CHANGELOG.md | head -n -1)

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release ${VERSION}"
          fi

          echo "$CHANGELOG" > changelog_section.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.get_version.outputs.VERSION }}
          body_path: changelog_section.md
          files: "*.tgz"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

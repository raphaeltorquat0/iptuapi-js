name: Update SDK Status

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'  # Daily at 7 AM UTC (after validation)

permissions:
  contents: write

jobs:
  update-status:
    name: Update SDK Status
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Get validation status
        id: validation
        run: |
          VALIDATION_STATUS=$(gh run list --workflow=sdk-validation.yml --limit 1 --json conclusion --jq '.[0].conclusion // "unknown"')
          if [ "$VALIDATION_STATUS" = "success" ]; then
            echo "STATUS=FUNCIONAL" >> $GITHUB_OUTPUT
            echo "EMOJI=🟢" >> $GITHUB_OUTPUT
          else
            echo "STATUS=VERIFICAR" >> $GITHUB_OUTPUT
            echo "EMOJI=🟡" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update SDK-STATUS.md
        run: |
          DATE=$(date -u +%Y-%m-%d)
          VERSION="${{ steps.version.outputs.VERSION }}"
          STATUS="${{ steps.validation.outputs.STATUS }}"
          EMOJI="${{ steps.validation.outputs.EMOJI }}"
          
          cat > SDK-STATUS.md << EOF
          # JavaScript/TypeScript SDK Status

          **Última atualização:** ${DATE}
          **Versão:** ${VERSION}
          **Status:** ${EMOJI} ${STATUS}

          ---

          ## Informações

          | Item | Valor |
          |------|-------|
          | **Versão** | ${VERSION} |
          | **Registry** | npm (\`npm install iptuapi\`) |
          | **Status** | ${EMOJI} ${STATUS} |
          | **Mínimo** | Node.js 18+ |

          ## Instalação

          \`\`\`bash
          npm install iptuapi
          \`\`\`

          ## Exemplo Rápido

          \`\`\`javascript
          const { IPTUClient } = require('iptuapi');

          const client = new IPTUClient('sua_api_key');
          const cidades = await client.iptuToolsCidades();
          console.log(\`\${cidades.total} cidades disponíveis\`);
          \`\`\`

          ## Validação Automática

          Este SDK é validado automaticamente:
          - ✅ Instalação limpa via npm
          - ✅ Import do pacote (CJS e ESM)
          - ✅ Teste contra API real (\`iptuToolsCidades\`)
          - ✅ Teste autenticado (\`consultaEndereco\`)

          ---

          *Atualizado automaticamente pelo CI/CD*
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SDK-STATUS.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update SDK status [skip ci]"
            git push
          fi
